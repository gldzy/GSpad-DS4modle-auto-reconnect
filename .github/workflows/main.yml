name: Build GSpad ELF
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y wget tar

      - name: Download prebuilt ps5-payload-sdk
        run: |
          wget https://github.com/ps5-payload-dev/sdk/releases/download/v0.43/ps5-payload-sdk-linux-x86_64.tar.xz
          tar -xf ps5-payload-sdk-linux-x86_64.tar.xz
          echo "PS5_PAYLOAD_SDK=$PWD/ps5-payload-sdk" >> $GITHUB_ENV

      - name: Build ELF
        run: make

      - name: Upload compiled elf
        uses: actions/upload-artifact@v4
        with:
          name: GSpad-elf
          path: GSpad-DS4modle-auto-reconnect.elf

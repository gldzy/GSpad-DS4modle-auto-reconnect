name: Build GSpad ELF
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt update
          sudo apt install -y clang-18 lld-18 git make

      - name: Clone SDK source（带镜像加速）
        run: |
          git clone --depth=1 --branch main https://ghproxy.com/https://github.com/ps5-payload-dev/sdk.git
          cd sdk
          make
          echo "PS5_PAYLOAD_SDK=$PWD" >> $GITHUB_ENV

      - name: Build ELF
        run: make

      - name: Upload compiled elf
        uses: actions/upload-artifact@v4
        with:
          name: GSpad-elf
          path: GSpad-DS4modle-auto-reconnect.elf
